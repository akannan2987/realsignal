# pytest.ini: settings for the automated tests.
#
# testpaths tells pytest to look for tests only in tests/. Without it, pytest
# would also wander into data/, where the downloaded archive is unpacked.
# pythonpath adds src/ to the places Python looks, so a test can write
# "from realsignal import helpers" (Phase 3).
# Explained in docs/02-phase-1-data-acquisition.md (the tests section) and
# docs/04-phase-3-harmonisation.md (the tests section).
[pytest]
testpaths = tests
pythonpath = src
addopts = -ra
